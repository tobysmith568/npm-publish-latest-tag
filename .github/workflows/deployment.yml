name: Deployment
run-name: Deployment for v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: A SemVer for the release
        default: ""
        required: true
        type: string

defaults:
  run:
    shell: pwsh

concurrency:
  group: Continuous Deployment
  cancel-in-progress: false

jobs:
  calculate:
    name: Calculate Variables

    runs-on: ubuntu-latest

    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      npm_tag: ${{ steps.npm_tag.outputs.latest-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Set Version
        run: bunx turbo run version
        env:
          VERSION: ${{ inputs.version }}

      - name: Calculate npm tag
        uses: tobysmith568/npm-publish-latest-tag@v2
        id: npm_tag
        with:
          package-json: ./packages/npm-publish-latest-tag/package.json

  integration:
    name: Run Continuous Integration

    needs:
      - calculate

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    uses: ./.github/workflows/integration.yml
    secrets: inherit

  publish:
    name: Publish to npm

    needs:
      - calculate
      - integration

    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - name: Download Library Build
        uses: actions/download-artifact@v8
        with:
          name: library-build
          path: packages/npm-publish-latest-tag/dist

      - name: Set Version
        run: bunx turbo run version
        env:
          VERSION: ${{ inputs.version }}

      - name: Pack
        run: bunx turbo run pack

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@latest

      - name: Publish
        run: bunx turbo run publish
        env:
          NPM_TAG: ${{ needs.calculate.outputs.npm_tag }}

  release:
    name: Create GitHub Release

    needs:
      - calculate
      - publish

    runs-on: ubuntu-latest

    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Action Build
        uses: actions/download-artifact@v8
        with:
          name: action-build
          path: packages/github-action/dist

      # GitHub runs an Action from a committed file, so the bundle is committed here on a commit
      # that nothing but the release tags point at. It never lands on a branch.
      #
      # The floating minor and major tags only move for a stable release of the current major:
      # pre-releases and patches to old majors only get their exact version tag.
      - name: Tag the release commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --detach
          git add --force packages/github-action/dist/action.cjs
          git commit --message "Release v$VERSION"

          tags=("v$VERSION")

          if [ "$NPM_TAG" = "latest" ] && [[ "$VERSION" != *-* ]]; then
            IFS=. read -r major minor _ <<< "$VERSION"
            tags+=("v$major.$minor" "v$major")
          fi

          for tag in "${tags[@]}"; do
            git tag --force "$tag"
          done

          git push --force origin "${tags[@]/#/refs/tags/}"
        env:
          VERSION: ${{ inputs.version }}
          NPM_TAG: ${{ needs.calculate.outputs.npm_tag }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          prerelease: ${{ contains(inputs.version, '-') }}
          make_latest: ${{ needs.calculate.outputs.npm_tag == 'latest' }}
          generate_release_notes: true
          body: |
            # Release v${{ inputs.version }}

            Download from [npm](https://www.npmjs.com/package/npm-publish-latest-tag/v/${{ inputs.version }}): `npm install npm-publish-latest-tag@${{ inputs.version }} --save-dev`
