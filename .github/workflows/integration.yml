name: Continuous Integration
run-name: Continuous Integration for ${{ (github.event.pull_request.number && format('PR {0}', github.event.pull_request.number)) || github.ref_name }}

on:
  push:
    branches:
      - main
      - renovate/*
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  format:
    name: Format

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run Prettier
        run: bun run format:check

  lint:
    name: Lint

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run ESLint
        run: bun run lint

  typecheck:
    name: Typecheck

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Check types
        run: bun run typecheck

  licence:
    name: Check licences

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Check licences
        run: bun run license-check

  build:
    name: Build

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs:
      - typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build
        run: bun run build

      - name: Upload Library Build
        uses: actions/upload-artifact@v7
        with:
          name: library-build
          path: packages/npm-publish-latest-tag/dist
          retention-days: 1
          if-no-files-found: error

      - name: Upload Action Build
        uses: actions/upload-artifact@v7
        with:
          name: action-build
          path: packages/github-action/dist
          retention-days: 1
          if-no-files-found: error

  test:
    name: Test

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs:
      - typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run Tests
        run: bun run test

      - name: Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  codeql:
    name: CodeQL

    uses: ./.github/workflows/codeql.yml

    secrets: inherit

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    name: E2E on ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: 10

    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # action.yml points at the built bundle, which isn't committed
      - name: Download Action Build
        uses: actions/download-artifact@v8
        with:
          name: action-build
          path: packages/github-action/dist

      - if: always()
        uses: ./
        continue-on-error: true
        id: higher-patch-version
        with:
          package-json: "./e2e/higher-patch-version/package.json"
      - if: always()
        run: 'exit ("${{ steps.higher-patch-version.outputs.latest-tag }}" -eq "latest" ? 0 : 1)'

      - if: always()
        uses: ./
        continue-on-error: true
        id: higher-minor-version
        with:
          package-json: "./e2e/higher-minor-version/package.json"
      - if: always()
        run: 'exit ("${{ steps.higher-minor-version.outputs.latest-tag }}" -eq "latest" ? 0 : 1)'

      - if: always()
        uses: ./
        continue-on-error: true
        id: higher-major-version
        with:
          package-json: "./e2e/higher-major-version/package.json"
      - if: always()
        run: 'exit ("${{ steps.higher-major-version.outputs.latest-tag }}" -eq "latest" ? 0 : 1)'

      - if: always()
        uses: ./
        continue-on-error: true
        id: higher-patch-version-than-v1
        with:
          package-json: "./e2e/higher-patch-version-than-v1/package.json"
      - if: always()
        run: 'exit ("${{ steps.higher-patch-version-than-v1.outputs.latest-tag }}" -eq "latest-1" ? 0 : 1)'

      - if: always()
        uses: ./
        continue-on-error: true
        id: higher-minor-version-than-v1
        with:
          package-json: "./e2e/higher-minor-version-than-v1/package.json"
      - if: always()
        run: 'exit ("${{ steps.higher-minor-version-than-v1.outputs.latest-tag }}" -eq "latest-1" ? 0 : 1)'

      - if: always()
        uses: ./
        continue-on-error: true
        id: lower-major-version-than-all
        with:
          package-json: "./e2e/lower-major-version-than-all/package.json"
      - if: always()
        run: 'exit ("${{ steps.lower-major-version-than-all.outputs.latest-tag }}" -eq "latest-0" ? 0 : 1)'

      - if: always()
        uses: ./
        continue-on-error: true
        id: does-not-exist
        with:
          package-json: "./e2e/does-not-exist/package.json"
      - if: always()
        run: 'exit ("${{ steps.does-not-exist.outputs.latest-tag }}" -eq "latest" ? 0 : 1)'

      - if: always()
        uses: ./
        continue-on-error: true
        id: invalid-path
        with:
          package-json: "./e2e/invalid-path/package.json"
      - if: always()
        run: 'exit ("${{ steps.invalid-path.outputs.latest-tag }}" -eq "" ? 0 : 1)'
